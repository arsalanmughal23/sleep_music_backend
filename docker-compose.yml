services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        - APP_ENV=${APP_ENV:-local}
    container_name: web_server
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - ./docker/apache/laravel.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
    depends_on:
      - db
    networks:
      - my_network

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_USER=${MYSQL_USER:-username}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-project_db}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - my_network
    command: --default-authentication-plugin=mysql_native_password

networks:
  my_network:
    driver: bridge

volumes:
  db_data: